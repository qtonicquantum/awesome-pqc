name: monthly-linkcheck
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  link-check:
    name: monthly-link-check
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-redirects 5 './README.md' './CONTRIBUTING.md' './docs/**/*.md'
          fail: false
      - name: Create issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Monthly link check found broken links'
          content-filepath: ./lychee/out.md
          labels: broken-link, automated
